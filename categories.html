<div class="layout">

  <aside class="sidebar">

    </div>

    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <input type="search" class="search-input" id="searchInput" placeholder="搜索文章..." autocomplete="off" spellcheck="false">
    </div>

    <nav class="nav" aria-label="主导航">
      <a class="nav-item" href="./index.html">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M3 12h18M3 19h18"/></svg>
        分类

      <div class="profile-label">关于</div>
      <p class="profile-text">一个收集日常的小角落。种着向日葵的小森林，慢慢长。</p>
      <div class="profile-stats">
        <div><strong>627</strong>篇</div>
        <div><strong>1.2k</strong>阅读</div>

      <a href="./index.html">回到首页</a>

  </aside>

  <main class="main">
    <div class="tabs" style="border-bottom:none;">
      <div class="tab is-active" data-sort="latest">按主题</div>
    </div>

    <h1 style="font-size:24px;margin:4px 0 6px;">全部分类</h1>
    <p style="font-size:13.5px;color:var(--text-2);margin:0 0 8px;line-height:1.8;">
      这里收录了 620 篇公开网络上的实用笔记，按主题重新归档。每一篇都附有原文链接，方便回溯与核对。
    </p>

    <div class="cat-index" id="catIndex"></div>

    <h2 style="font-size:16px;margin:36px 0 12px;font-weight:600;">原始收藏夹</h2>
    <p style="font-size:13px;color:var(--text-3);margin:0 0 14px;line-height:1.8;">
      下面是当初收藏时用的原始夹子名，每篇文章都标注了它来自哪个夹子。
    </p>
    <table class="folder-table" id="folderTable"></table>

    <div class="footer">
      © 芬达石森林 2026 ·
      <a href="#">Typecho.zeze</a>
    </div>
  </main>
</div>

<script>
(async function () {
  const res = await fetch('posts.json', { cache: 'no-cache' });
  const data = await res.json();
  const cats = data.categories || [];
  const folders = data.folders || [];

  const order = ['职场成长','健身健康','自我成长','影音剪辑','理财消费','生活杂项','缝纫手作',
                 '旅行户外','游戏娱乐','居住家装','语言学习','饮食营养','情感关系','萌宠动物','journal'];
  const map = {};
  cats.forEach(c => { map[c.name] = c; });
  const ordered = order.filter(n => map[n]).map(n => map[n])
    .concat(cats.filter(c => !order.includes(c.name)));

  document.getElementById('catIndex').innerHTML = ordered.map(c => {
    const href = c.slug === 'all' ? './index.html'
      : c.slug === 'journal' ? './index.html#journal'
      : './index.html#' + c.slug;
    return `<a class="cat-card" href="${href}">
      <h3>${esc(c.name)}<span class="cat-num">${c.count} 篇</span></h3>
      <p>${esc(c.desc || '')}</p>
    </a>`;
  }).join('');

  document.getElementById('folderTable').innerHTML =
    '<thead><tr><th>收藏夹</th><th>篇数</th></tr></thead><tbody>' +
    folders.map(f => `<tr><td>${esc(f.name)}</td><td class="num">${f.count}</td></tr>`).join('') +
    '</tbody>';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  const saved = localStorage.getItem('fendashi-theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  const btn = document.getElementById('themeBtnMobile');
  if (btn) btn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('fendashi-theme', next);
  });
})();
</script>
</body>
</html>
